<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0ece5">
  <meta name="description" content="和塚博士一起，漫步雲端的浮空研究島。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2329483e'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Georgia' font-size='48' fill='%23fffaf0'%3EO%3C/text%3E%3C/svg%3E">
  <title>Otsuka Island｜塚博士的浮空島</title>
  <link rel="stylesheet" href="styles.css?v=21">
  <script src="outlines.js?v=14" defer></script>
  <script src="life.js?v=18" defer></script>
  <script src="room-topics.js?v=20" defer></script>
  <script src="room-world.js?v=21" defer></script>
  <script src="island-cat.js?v=21" defer></script>
  <script src="rooms.js?v=21" defer></script>
  <script src="audio.js?v=21" defer></script>
  <script src="doctor-greetings.js?v=19" defer></script>
  <script src="game.js?v=21" defer></script>
</head>
<body>
  <header class="header"><a class="brand" href="./" aria-label="Otsuka Island 首頁"><span class="brand-mark">O<span>✦</span></span><span>OTSUKA ISLAND</span></a></header>
  <main class="experience">
    <h1 class="sr-only">塚博士的浮空島</h1>
    <canvas id="world" tabindex="0" aria-label="浮空島互動地圖。點選地面散步、點選建築進屋。拖曳移動，滾輪或雙指縮放。右下角可開啟工具與地點。"></canvas>
    <div id="building-name" class="building-name" role="status" aria-live="polite" hidden></div>
    <div id="loading" class="loading"><span class="loader"></span><p>正在前往Otsuka-Island</p></div>
    <a class="mobile-qr" href="https://mild0317.github.io/Otsuka-Island/" aria-label="手機掃描 QR Code，開啟浮空島手機版">
      <img src="assets/mobile-qr.svg" width="123" height="123" alt="浮空島手機版網址 QR Code">
      <span>手機掃碼探索</span>
    </a>
    <div class="scene-dock" aria-label="浮空島控制">
      <button id="sound-toggle" title="關閉音樂與音效" aria-label="關閉音樂與音效" aria-pressed="true">♫</button>
      <button id="fit" title="完整小島（R）" aria-label="重設地圖，顯示完整小島">⛶</button>
      <button id="ui-toggle" title="工具與地點" aria-label="開啟工具與地點" aria-controls="island-controls" aria-expanded="false">☰</button>
    </div>
    <section id="island-controls" class="island-controls" aria-labelledby="controls-title" hidden>
      <div class="controls-heading"><h2 id="controls-title">探索工具</h2><button id="controls-close" aria-label="收起工具">×</button></div>
      <div class="controls-content">
        <nav class="destinations" aria-label="島嶼地點">
          <button class="place" data-place="clock"><span class="place-icon">01</span><strong>設計工作室</strong></button>
          <button class="place" data-place="workshop"><span class="place-icon">02</span><strong>製作工坊</strong></button>
          <button class="place" data-place="library"><span class="place-icon">03</span><strong>驗証工作室</strong></button>
          <button class="place" data-place="lab"><span class="place-icon">04</span><strong>模擬實驗室</strong></button>
        </nav>
        <div class="map-tools" aria-label="地圖控制">
          <button id="zoom-out" title="縮小（−）" aria-label="縮小">−</button>
          <span id="zoom-value">100%</span>
          <button id="zoom-in" title="放大（+）" aria-label="放大">＋</button>
          <button id="follow" title="跟隨博士" aria-label="跟隨博士" aria-pressed="false">◎</button>
        </div>
        <section class="light-panel" aria-label="島上時間與光影">
          <div class="light-heading"><span>島上光影</span><time id="island-time">--:--</time><button id="live-time" title="回到台灣即時時間">即時</button></div>
          <input id="light-time" type="range" min="0" max="23.99" step="0.05" aria-label="預覽一天的光影時間">
          <div class="light-labels"><span>晨光</span><span id="time-mode">台灣即時</span><span>暮色</span></div>
        </section>
        <section class="doctor-card" aria-label="塚博士狀態">
          <div class="doctor-info"><div class="doctor-name">塚博士</div><p><i id="status-dot"></i><span id="status" role="status">正在享受島上的微風</span></p></div>
          <button id="wave" class="wave-button" title="和博士打招呼（G）" aria-label="和博士揮手打招呼">✋</button>
        </section>
        <div class="sound-settings"><label for="sound-volume">音樂與音效音量</label><input id="sound-volume" type="range" min="0" max="100" value="35" aria-label="音樂、鳥聲與房間音效音量"><output id="sound-volume-value" for="sound-volume">35%</output></div>
        <div class="controls-footer"><button id="motion-toggle" aria-pressed="true" title="播放或暫停環境與待機動畫">動態 開</button><span class="version">互動測試版 21</span></div>
        <p class="controls-help">點建築進屋，點地面散步。<br>拖曳探索 · <span id="zoom-hint">滾輪縮放</span></p>
      </div>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="doctor-speech" class="sr-only" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
