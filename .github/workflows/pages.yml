name: Publish island and PowerPoints
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install slide rendering tools
        run: sudo apt-get update && sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk fonts-crosextra-carlito fonts-crosextra-caladea
      - name: Render maintained PowerPoints
        run: python3 scripts/build-ppt.py
      - name: Prepare public website
        run: |
          mkdir _site
          cp *.html *.js *.css .nojekyll _site/
          cp -r assets PPT _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
