name: Publish island and PowerPoints
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check whether PowerPoints changed
        id: ppt
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('PPT')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8-sig'))
          changed = False
          for deck in manifest.values():
              digest = hashlib.sha256((root / deck['source']).read_bytes()).hexdigest()
              changed |= digest != deck['sha256'] or not deck['slides'] or not all((root / slide).is_file() for slide in deck['slides'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('render=' + str(changed).lower(), file=output)
          PY
      - name: Install slide rendering tools
        if: steps.ppt.outputs.render == 'true'
        run: sudo apt-get update && sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk fonts-crosextra-carlito fonts-crosextra-caladea
      - name: Render maintained PowerPoints
        if: steps.ppt.outputs.render == 'true'
        run: python3 scripts/build-ppt.py
      - name: Prepare public website
        run: |
          mkdir _site
          cp *.html *.js *.css .nojekyll Otsuka-Island.jpg Otsuka-Docter.jpg _site/
          cp -r assets PPT _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
